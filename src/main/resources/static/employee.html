<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h2>Employee Dashboard</h2>
            <div>
                <span id="user-name-display"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="panel">
            <h3>Attendance</h3>
            <button id="btn-checkin" onclick="checkIn()">Check In</button>
            <button id="btn-checkout" onclick="checkOut()">Check Out</button>
            <p id="att-message"></p>

            <h4>My Attendance History</h4>
            <table id="att-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Hours Worked</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="panel">
            <h3>Leave Management</h3>
            <p>Remaining Leave Balance: <strong id="leave-balance">...</strong> days</p>
            
            <h4>Apply for Leave</h4>
            <form id="leave-form">
                <div class="form-group">
                    <label>Start Date:</label>
                    <input type="date" id="leave-start" required>
                </div>
                <div class="form-group">
                    <label>End Date:</label>
                    <input type="date" id="leave-end" required>
                </div>
                <button type="submit">Submit Request</button>
                <p id="leave-message"></p>
            </form>

            <h4>My Leave Requests</h4>
            <table id="leave-table">
                <thead>
                    <tr>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Days</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        // Check session on load
        window.onload = () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user || user.role !== "EMPLOYEE") {
                window.location.href = "index.html";
                return;
            }
            document.getElementById("user-name-display").innerText = "Welcome, " + user.name;
            document.getElementById("leave-balance").innerText = user.leaveBalance;
            loadEmployeeData(user.id);
        };
    </script>
</body>
</html>
