<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Attendance Management System</h1>
        
        <div id="auth-forms">
            <div class="form-box">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="login-btn">Login</button>
                    <p id="login-error" class="error"></p>
                </form>
            </div>

            <div class="form-box">
                <h2>Register</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="reg-email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                    </div>
                    <div class="form-group">
                        <label>Role:</label>
                        <select id="reg-role">
                            <option value="EMPLOYEE">Employee</option>
                            <option value="HR">HR</option>
                        </select>
                    </div>
                    <button type="submit" id="reg-btn">Register</button>
                    <p id="reg-error" class="error"></p>
                    <p id="reg-success" class="success"></p>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
